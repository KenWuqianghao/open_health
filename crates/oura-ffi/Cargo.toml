[package]
name = "oura-ffi"
description = "C-ABI surface over the shared analysis core, for the iOS/native clients"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# staticlib → liboura_ffi.a to link into the iOS app; cdylib is handy for desktop tests.
crate-type = ["staticlib", "lib"]

[dependencies]
oura-analysis = { git = "https://github.com/KenWuqianghao/open_oura", rev = "4c83f0d84b00a9a189fbc70305d105de0c435f3d" }
