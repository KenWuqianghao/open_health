[package]
name = "oura-summary"
description = "The dashboard summary computation, shared by the web (oura-cli) and native (oura-core) clients"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
oura-protocol = { git = "https://github.com/KenWuqianghao/open_oura", rev = "4c83f0d84b00a9a189fbc70305d105de0c435f3d" }
oura-store = { git = "https://github.com/KenWuqianghao/open_oura", rev = "4c83f0d84b00a9a189fbc70305d105de0c435f3d" }
oura-analysis = { git = "https://github.com/KenWuqianghao/open_oura", rev = "4c83f0d84b00a9a189fbc70305d105de0c435f3d" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
