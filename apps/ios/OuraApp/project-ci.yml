# xcodegen spec for a MODEL-FREE build of OuraApp — the CI / Xcode Cloud target.
# No libtorch / .ptl / oura.db (all gitignored local artifacts that a clean cloud
# checkout doesn't have), so it builds from just the repo + the Rust xcframework that
# ci_scripts/ci_post_clone.sh rebuilds. The app shows the model-free summary and can
# sync from a real ring over BLE; the on-device hypnogram/CVA/activity models are only
# in the local torch build (project.yml). Generate with:
#   xcodegen generate --spec project-ci.yml
name: OuraApp
options:
  bundleIdPrefix: md.thomas
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

schemes:
  OuraApp:
    build:
      targets:
        OuraApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [OuraAppTests]
    archive:
      config: Release

settings:
  base:
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "23"
    # The base of every bundle id. A build for another team overrides this one
    # setting on the command line (APP_BUNDLE_ID=com.example.openoura); the widget
    # extension and the App Group follow it.
    APP_BUNDLE_ID: md.thomas.openoura
    APP_GROUP_ID: group.$(APP_BUNDLE_ID)
    TARGETED_DEVICE_FAMILY: "1"   # iPhone only (no iPad multitasking orientation reqs)
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_ENTITLEMENTS: OuraApp.entitlements
    DEVELOPMENT_TEAM: "BQ6Z84B8L5"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

targets:
  OuraAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: OuraApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/OuraApp.app/OuraApp"
        BUNDLE_LOADER: "$(TEST_HOST)"
  OuraWidgets:
    type: app-extension
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widgets
        INFOPLIST_FILE: ../OuraWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: ../OuraWidgets/OuraWidgets.entitlements
        SKIP_INSTALL: YES
        SWIFT_EMIT_LOC_STRINGS: YES
    sources:
      - path: ../OuraWidgets/OuraWidgets.swift
      - path: Snapshot.swift
  OuraApp:
    type: application
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        STRING_CATALOG_GENERATE_SYMBOLS: YES
        TARGETED_DEVICE_FAMILY: "1"   # iPhone-only (target-level, overrides xcodegen's 1,2 default)
        OTHER_LDFLAGS: [-lsqlite3]
    sources:
      - path: OuraApp.swift
      - path: Models.swift
      - path: Core.swift
      - path: HubPush.swift
      - path: HealthReader.swift
      - path: HealthCatalog.swift
      - path: HealthBackground.swift
      - path: Components.swift
      - path: Reports.swift
      - path: Theme.swift
      - path: Motion.swift
      - path: Trends.swift
      - path: BLETransport.swift
      - path: RingCentral.swift
      - path: RingSync.swift
      - path: SyncCoordinator.swift
      - path: BackgroundSync.swift
      - path: AppDelegate.swift
      - path: AppHooks.swift
      - path: PairedRing.swift
      - path: RingPairing.swift
      - path: Pairing.swift
      - path: ProfileSettings.swift
      - path: ModelProgress.swift
      - path: CrashCatch.c
      - path: CrashCatch.h
      - path: Diagnostics.swift
      - path: HealthModels.swift
      - path: HealthPlanner.swift
      - path: HealthExportState.swift
      - path: HealthStoreClient.swift
      - path: HealthExporter.swift
      - path: Units.swift
      - path: Insights.swift
      - path: InsightViews.swift
      - path: Journal.swift
      - path: Workouts.swift
      - path: LiveHeart.swift
      - path: RingScreen.swift
      - path: DataTools.swift
      - path: HealthImport.swift
      - path: Notifier.swift
      - path: Snapshot.swift
      - path: SnapshotWriter.swift
      - path: AppIntents.swift
      - path: ../generated/oura_core.swift
      - path: Assets.xcassets
    dependencies:
      - target: OuraWidgets
        embed: true
      - sdk: HealthKit.framework
      - sdk: BackgroundTasks.framework
      - framework: ../OuraCore.xcframework
        embed: false
