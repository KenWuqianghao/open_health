[package]
name = "oura-cli"
description = "Command-line client for reading data directly from an Oura ring"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "oura"
path = "src/main.rs"

[dependencies]
oura-protocol = { git = "https://github.com/KenWuqianghao/open_oura", rev = "4c83f0d84b00a9a189fbc70305d105de0c435f3d" }
oura-link = { git = "https://github.com/KenWuqianghao/open_oura", rev = "4c83f0d84b00a9a189fbc70305d105de0c435f3d" }
oura-store = { git = "https://github.com/KenWuqianghao/open_oura", rev = "4c83f0d84b00a9a189fbc70305d105de0c435f3d" }
oura-summary = { path = "../oura-summary" }
oura-dna = { path = "../oura-dna" }
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
hex = "0.4"
serde_json = "1"
regex = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
# Outbound HTTPS is used ONLY to fetch PUBLIC PGS Catalog score *definitions* from
# EBI on explicit user action (see dna.rs); no genome/personal data is ever sent.
# rustls (no system OpenSSL) keeps the macOS build turnkey.
ureq = { version = "2", default-features = false, features = ["tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
