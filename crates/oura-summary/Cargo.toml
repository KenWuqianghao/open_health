[package]
name = "oura-summary"
description = "The dashboard summary computation, shared by the web (oura-cli) and native (oura-core) clients"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
oura-protocol = { git = "https://github.com/KenWuqianghao/open_oura", rev = "09763f2f7fb12551edc5cc4ece094629a629c023" }
oura-store = { git = "https://github.com/KenWuqianghao/open_oura", rev = "09763f2f7fb12551edc5cc4ece094629a629c023" }
oura-analysis = { git = "https://github.com/KenWuqianghao/open_oura", rev = "09763f2f7fb12551edc5cc4ece094629a629c023" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
